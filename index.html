<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>梦幻西游 · 单机版</title>
<style>
/* ============================================================
   梦幻西游 · Q版像素单机  —— 第 1 批
   全局重置 / 木纹面板 / 顶部状态栏
   ============================================================ */
:root{
  --wood-dark:#2a1608;
  --wood:#5a3218;
  --wood-lt:#8a5228;
  --wood-hl:#a86a34;
  --gold:#f0c860;
  --gold-dk:#a87828;
  --gold-lt:#ffe8a0;
  --jade:#4a9a7a;
  --jade-dk:#2a6a52;
  --red:#c03030;
  --red-dk:#801818;
  --blue:#3a70c0;
  --blue-dk:#1a4080;
  --purple:#8050b0;
  --paper:#f0e0b8;
  --ink:#2a1a0a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Heiti SC",sans-serif;
  font-size:12px;
  background:#0a0604;
  color:#f0e0b8;
  display:flex;justify-content:center;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}
#game{
  width:100%;max-width:640px;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:#1a0e08;
  box-shadow:0 0 80px rgba(0,0,0,.95);
}

/* ================= 通用木纹面板 ================= */
.wood{
  background:
    repeating-linear-gradient(92deg,
      rgba(0,0,0,.10) 0 2px,
      rgba(255,220,160,.03) 2px 5px,
      transparent 5px 9px),
    linear-gradient(180deg,#6b3a1a 0%,#4a2812 55%,#3a1f0e 100%);
  border:2px solid var(--wood-dark);
  border-radius:6px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,120,.22),
    inset 0 2px 4px rgba(255,220,160,.12),
    inset 0 -4px 8px rgba(0,0,0,.5),
    0 3px 8px rgba(0,0,0,.55);
  position:relative;
}
.wood::after{
  content:'';position:absolute;inset:3px;
  border:1px solid rgba(240,200,120,.16);
  border-radius:4px;pointer-events:none;
}

/* ================= 金色镶边面板 ================= */
.gold-frame{
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 6px),
    linear-gradient(180deg,#5a3218,#3a1f0e);
  border:3px solid var(--gold-dk);
  border-radius:8px;
  box-shadow:
    inset 0 0 0 1px var(--gold),
    inset 0 0 24px rgba(240,200,96,.12),
    0 4px 16px rgba(0,0,0,.65);
  position:relative;
}
.gold-frame::before{
  content:'';position:absolute;inset:4px;
  border:1px dashed rgba(240,200,96,.35);
  border-radius:5px;pointer-events:none;
}

/* 金色卷轴标题 */
.scroll-title{
  display:inline-block;
  padding:3px 22px;
  font-size:12px;letter-spacing:4px;
  color:#3a1f0e;
  font-weight:bold;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold),var(--gold-dk));
  border:2px solid #6a4810;
  border-radius:12px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -2px 4px rgba(120,80,20,.4),
    0 2px 5px rgba(0,0,0,.5);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
  position:relative;
}
.scroll-title::before,
.scroll-title::after{
  content:'❖';
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:9px;color:#6a4810;
}
.scroll-title::before{left:6px}
.scroll-title::after{right:6px}

/* ================= 顶部状态栏 ================= */
#topbar{
  flex-shrink:0;z-index:30;
  display:flex;align-items:stretch;gap:4px;
  padding:5px 6px 5px;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.15) 0 2px,
      transparent 2px 6px),
    linear-gradient(180deg,#5a3218,#2a1608);
  border-bottom:3px solid #140a04;
  box-shadow:
    0 3px 0 rgba(0,0,0,.4),
    0 4px 10px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(240,200,96,.25);
}

/* 头像框 */
#portrait{
  width:58px;height:64px;flex-shrink:0;
  background:linear-gradient(180deg,#6b3a18,#3a1f0e);
  border:2px solid var(--gold-dk);
  border-radius:5px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.55),
    inset 0 0 12px rgba(0,0,0,.6),
    0 2px 5px rgba(0,0,0,.5);
  display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;position:relative;
}
#portrait svg{width:100%;height:100%;display:block}
#portrait::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 6px var(--gold);
}

/* 中段信息区 */
.info-mid{
  flex:1;min-width:0;
  display:flex;flex-direction:column;gap:3px;
  justify-content:center;
}
.name-row{
  display:flex;align-items:center;gap:5px;
  min-width:0;
}
#pName{
  font-size:13px;font-weight:bold;
  color:var(--gold-lt);
  letter-spacing:.5px;
  text-shadow:0 1px 0 #000,0 0 8px rgba(240,200,96,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:92px;
}
#pSect{
  font-size:10px;color:#fff;
  padding:1px 7px;border-radius:9px;
  background:linear-gradient(180deg,var(--jade),var(--jade-dk));
  border:1px solid #163a2a;
  box-shadow:
    0 1px 0 rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.3);
  white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
}
#pLv{
  font-size:10px;color:var(--gold);
  margin-left:auto;
  text-shadow:0 1px 0 #000;
  white-space:nowrap;
}
#pLv b{color:#fff;font-size:11px}

/* 三条状态条 */
.bars{
  display:flex;flex-direction:column;gap:3px;
}
.sbar{
  height:11px;position:relative;
  background:#180c04;
  border:1px solid #060302;
  border-radius:6px;
  box-shadow:
    inset 0 2px 3px rgba(0,0,0,.85),
    inset 0 -1px 0 rgba(255,220,160,.08);
  overflow:hidden;
}
.sbar .fill{
  height:100%;width:0;
  border-radius:5px;
  transition:width .3s ease;
  position:relative;
}
.sbar .fill::after{
  content:'';position:absolute;inset:0;
  border-radius:5px;
  background:linear-gradient(180deg,
    rgba(255,255,255,.45) 0%,
    rgba(255,255,255,.1) 40%,
    transparent 55%,
    rgba(0,0,0,.25) 100%);
}
.sbar.hp .fill{
  background:linear-gradient(90deg,#8a1010,#d02828 45%,#ff6050);
  box-shadow:0 0 6px rgba(224,48,48,.6);
}
.sbar.mp .fill{
  background:linear-gradient(90deg,#0a2090,#2a60d8 45%,#60a0ff);
  box-shadow:0 0 6px rgba(48,112,224,.6);
}
.sbar.exp .fill{
  background:linear-gradient(90deg,#906010,#e0a820 45%,#ffe070);
  box-shadow:0 0 6px rgba(240,184,48,.6);
}
.sbar .label{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 6px;
  font-size:8.5px;color:#fff;
  text-shadow:0 1px 2px #000;
  letter-spacing:.3px;
  pointer-events:none;
  font-weight:bold;
}
.sbar .label i{font-style:normal;color:#ffe8a0;font-weight:normal}

/* 金币框 */
#goldBox{
  flex-shrink:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 7px;
  border-left:1px solid rgba(240,200,96,.22);
  margin-left:1px;
}
#goldBox .g-icon{
  font-size:17px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
#goldBox .g-val{
  font-size:11px;font-weight:bold;
  color:var(--gold-lt);
  text-shadow:0 1px 0 #000,0 0 5px rgba(240,200,96,.6);
  white-space:nowrap;
  margin-top:1px;
}
#goldBox .g-val small{font-size:9px;color:#f0c860;font-weight:normal}

/* 状态图标行（气血/魔法小图标） */
.status-icons{
  display:flex;gap:6px;align-items:center;
  font-size:9px;color:#c0a870;
  margin-top:1px;
}
.status-icons span{
  display:flex;align-items:center;gap:2px;
  text-shadow:0 1px 0 #000;
}

/* ============================================================
   ↓↓↓ 第 1 批结束，第 2 批将接续：主视图区 / 地形块 / 玩家角色
   ============================================================ */


/* ===== 修复：第2/3批 CSS 已合并到同一个 style ===== */
/* ============================================================
   梦幻西游 · Q版像素单机  —— 第 2 批
   主视图区 / 地形块 / 玩家角色 / 场景HUD / 方向键
   ============================================================ */

/* ================= 主视图区 ================= */
#stage{
  flex:1;position:relative;overflow:hidden;
  background:#0a1a08;
  z-index:10;
}

/* 世界层：所有格子+角色都在这层 */
#world{
  position:absolute;inset:0;
  overflow:hidden;
}

/* ================= 地形块 ================= */
.tile{
  position:absolute;
  box-sizing:border-box;
  image-rendering:pixelated;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;
  will-change:transform;
}

/* 草地（两种明度交错，制造像素草地感） */
.t-grass{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.04) 0 4px,
      transparent 4px 8px),
    linear-gradient(180deg,#5aa044,#4a8836);
}
.t-grass2{
  background:
    repeating-linear-gradient(-45deg,
      rgba(0,0,0,.05) 0 4px,
      transparent 4px 8px),
    linear-gradient(180deg,#4a8836,#3a7028);
}

/* 土路 */
.t-path{
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.06) 0 3px,
      transparent 3px 7px),
    linear-gradient(180deg,#c8a878,#b09060);
}

/* 水面 */
.t-water{
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.10) 0 2px,
      transparent 2px 6px),
    linear-gradient(180deg,#4a80c0,#2a5a98);
  animation:waterFlow 3s ease-in-out infinite;
}
.t-water2{
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.08) 2px 4px,
      transparent 4px 8px),
    linear-gradient(180deg,#3a70b0,#205088);
  animation:waterFlow 3.5s ease-in-out infinite reverse;
}
@keyframes waterFlow{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.15)}
}

/* 树木（深绿底 + 树冠emoji） */
.t-tree{
  background:
    radial-gradient(circle at 50% 40%,#3a7a2a 0%,#2a5a1e 70%,#1e4416 100%);
}
.t-tree .deco{font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}

/* 岩石 */
.t-rock{
  background:
    radial-gradient(circle at 35% 30%,#a0a098 0%,#80807a 55%,#5a5a54 100%);
}
.t-rock .deco{font-size:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}

/* 沙地 */
.t-sand{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.03) 0 5px,
      transparent 5px 10px),
    linear-gradient(180deg,#e8d0a0,#d0b880);
}

/* 雪地 */
.t-snow{
  background:
    radial-gradient(circle at 30% 25%,#ffffff 0%,#e0eef8 50%,#c8dce8 100%);
}

/* 木桥 */
.t-bridge{
  background:
    repeating-linear-gradient(0deg,
      #8a5a30 0 8px,
      #6a4020 8px 9px);
  box-shadow:inset 0 0 0 2px #4a2810;
}

/* 建筑：墙 / 屋顶 / 地板 */
.t-wall{
  background:
    repeating-linear-gradient(0deg,
      #9a8060 0 12px,
      #7a6040 12px 14px),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.08) 0 20px,
      transparent 20px 22px);
  box-shadow:inset 0 0 0 2px #4a3820;
}
.t-roof{
  background:
    repeating-linear-gradient(90deg,
      #b84030 0 10px,
      #a03020 10px 12px);
  box-shadow:inset 0 0 0 2px #601810;
}
.t-floor{
  background:
    repeating-linear-gradient(0deg,
      #c8a878 0 14px,
      #b09060 14px 15px),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.05) 0 14px,
      transparent 14px 15px);
}

/* 花丛 */
.t-flower{
  background:linear-gradient(180deg,#5aa04a,#3a8028);
}
.t-flower .deco{font-size:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

/* 岩浆（火山） */
.t-lava{
  background:
    radial-gradient(circle at 50% 50%,#ff8020 0%,#e04010 40%,#a01808 100%);
  animation:lavaPulse 1.5s ease-in-out infinite;
}
@keyframes lavaPulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.35)}
}

/* 虚空 */
.t-void{
  background:
    radial-gradient(circle at 50% 50%,#2a2a44 0%,#14142a 70%,#08081a 100%);
}

/* 建筑装饰图标 */
.tile .build{
  font-size:24px;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
}
.tile .npc{
  font-size:22px;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
  animation:npcIdle 2s ease-in-out infinite;
}
@keyframes npcIdle{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}

/* ================= 玩家角色 ================= */
#player{
  position:absolute;z-index:15;
  width:44px;height:54px;
  pointer-events:none;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.6));
  transition:left .12s linear,top .12s linear;
}
#player svg{width:100%;height:100%;display:block}
#player.walking{
  animation:playerWalk .35s steps(2) infinite;
}
@keyframes playerWalk{
  0%,100%{transform:translateY(0) scaleY(1)}
  50%{transform:translateY(-3px) scaleY(.97)}
}

/* 玩家脚下光圈 */
#player::after{
  content:'';position:absolute;left:50%;bottom:-2px;
  width:34px;height:10px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(240,200,96,.55),rgba(240,200,96,0) 70%);
  border-radius:50%;
  pointer-events:none;
}

/* ================= 名字标签 ================= */
.name-tag{
  position:absolute;
  font-size:10px;font-weight:bold;
  color:#fff;
  white-space:nowrap;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:16;
  text-shadow:
    0 1px 0 #000,
    1px 0 0 #000,
    -1px 0 0 #000,
    0 -1px 0 #000,
    0 0 4px rgba(0,0,0,.8);
  letter-spacing:.3px;
}
.name-tag.npc{color:#ffe070}
.name-tag.mob{color:#ff8060}
.name-tag.shop{color:#80d0ff}
.name-tag.boss{color:#ff5050;font-size:11px}

/* ================= 场景标题 ================= */
#sceneTitle{
  position:absolute;top:10px;left:50%;
  transform:translateX(-50%);
  z-index:12;
  padding:4px 20px;
  background:
    linear-gradient(180deg,rgba(58,31,16,.95),rgba(26,14,8,.95));
  border:2px solid var(--gold-dk);
  border-radius:15px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.45),
    inset 0 1px 0 rgba(255,255,255,.1),
    0 3px 8px rgba(0,0,0,.65);
  font-size:11px;
  color:var(--gold-lt);
  letter-spacing:2px;
  text-shadow:0 1px 0 #000;
  pointer-events:none;
  white-space:nowrap;
}
#sceneTitle b{color:#fff;font-weight:bold}
#sceneTitle i{
  font-style:normal;color:#90c8a0;
  margin-left:5px;font-size:10px;
}

/* ================= 小地图按钮 ================= */
#miniMapBtn{
  position:absolute;top:10px;right:10px;
  z-index:14;
  width:46px;height:46px;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.1) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#7a4a20,#4a2812);
  border:2px solid var(--gold-dk);
  border-radius:7px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.5),
    inset 0 1px 0 rgba(255,255,255,.15),
    0 3px 7px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .08s;
}
#miniMapBtn:active{
  transform:translateY(1px);
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.5),
    inset 0 2px 4px rgba(0,0,0,.5),
    0 1px 3px rgba(0,0,0,.55);
}
#miniMapBtn .mi{
  font-size:18px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
#miniMapBtn .mt{
  font-size:8px;color:var(--gold-lt);
  margin-top:2px;letter-spacing:.5px;
  text-shadow:0 1px 0 #000;
}

/* ================= 方向键 ================= */
#dpad{
  position:absolute;right:12px;bottom:12px;
  z-index:18;
  display:grid;
  grid-template-columns:repeat(3,46px);
  grid-template-rows:repeat(3,46px);
  gap:3px;
}
#dpad button{
  font-family:inherit;
  font-size:22px;font-weight:bold;
  color:#ffe8a0;
  padding:0;
  display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#8a5228,#5a3218);
  border:2px solid #2a1608;
  border-radius:7px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.45),
    inset 0 -2px 3px rgba(0,0,0,.4),
    0 3px 0 #140a04,
    0 4px 7px rgba(0,0,0,.55);
  cursor:pointer;
  transition:all .06s;
  text-shadow:0 1px 0 #000,0 0 6px rgba(240,200,96,.4);
  -webkit-user-select:none;
}
#dpad button:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.45),
    inset 0 -1px 2px rgba(0,0,0,.4),
    0 0 0 #140a04,
    0 1px 3px rgba(0,0,0,.55);
}
#dpad .u{grid-column:2;grid-row:1}
#dpad .l{grid-column:1;grid-row:2}
#dpad .c{
  grid-column:2;grid-row:2;
  font-size:14px;
  background:
    radial-gradient(circle at 50% 35%,#a05830,#5a3218);
  color:#ffe070;
}
#dpad .r{grid-column:3;grid-row:2}
#dpad .d{grid-column:2;grid-row:3}

/* ================= 场景浮动提示 ================= */
#toast{
  position:absolute;left:50%;bottom:110px;
  transform:translateX(-50%) translateY(6px);
  z-index:30;
  padding:8px 18px;
  background:
    linear-gradient(180deg,rgba(58,31,16,.96),rgba(26,14,8,.96));
  border:2px solid var(--gold-dk);
  border-radius:15px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.4),
    0 4px 10px rgba(0,0,0,.7);
  color:var(--gold-lt);
  font-size:12px;
  letter-spacing:.5px;
  text-shadow:0 1px 0 #000;
  white-space:nowrap;
  max-width:90%;
  overflow:hidden;text-overflow:ellipsis;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= 顶部提示条（场景名切换） ================= */
#sceneBanner{
  position:absolute;top:44%;left:50%;
  transform:translate(-50%,-50%) scale(.85);
  z-index:40;
  padding:10px 34px;
  background:
    linear-gradient(180deg,rgba(58,31,16,.94),rgba(26,14,8,.94));
  border-top:2px solid var(--gold);
  border-bottom:2px solid var(--gold);
  box-shadow:
    0 0 24px rgba(240,200,96,.35),
    inset 0 0 24px rgba(240,200,96,.1);
  font-size:20px;font-weight:bold;
  letter-spacing:8px;
  color:var(--gold-lt);
  text-shadow:0 2px 0 #000,0 0 16px rgba(240,200,96,.8);
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease,transform .4s ease;
}
#sceneBanner.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* ============================================================
   ↓↓↓ 第 2 批结束，第 3 批将接续：底部菜单栏 / 弹窗容器 / 完整HTML结构
   ============================================================ */
/* ============================================================
   梦幻西游 · Q版像素单机  —— 第 3 批
   底部菜单栏 / 弹窗系统 / 通用对话框
   ============================================================ */

/* ================= 底部主菜单栏 ================= */
#bottomBar{
  flex-shrink:0;z-index:25;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  padding:6px 8px 8px;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.15) 0 2px,
      transparent 2px 6px),
    linear-gradient(0deg,#2a1608,#5a3218 60%,#3a1f0e);
  border-top:3px solid #140a04;
  box-shadow:
    0 -3px 0 rgba(0,0,0,.4),
    0 -5px 12px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(240,200,96,.25);
}

.menu-btn{
  position:relative;
  padding:6px 2px 5px;
  font-family:inherit;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1px;
  color:#ffe8a0;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#8a5228,#5a3218 55%,#3a1f0e);
  border:2px solid #2a1608;
  border-radius:7px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -3px 5px rgba(0,0,0,.45),
    0 3px 0 #140a04,
    0 4px 7px rgba(0,0,0,.5);
  cursor:pointer;
  transition:all .07s;
  -webkit-user-select:none;
  overflow:hidden;
}
.menu-btn::before{
  content:'';position:absolute;inset:2px;
  border:1px solid rgba(240,200,96,.18);
  border-radius:5px;pointer-events:none;
}
.menu-btn .mi{
  font-size:20px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
  transition:transform .1s;
}
.menu-btn .mt{
  font-size:10px;font-weight:bold;
  letter-spacing:1px;
  text-shadow:0 1px 0 #000,0 0 5px rgba(240,200,96,.4);
  color:#ffe8a0;
}
.menu-btn:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -1px 3px rgba(0,0,0,.45),
    0 0 0 #140a04,
    0 1px 3px rgba(0,0,0,.5);
}
.menu-btn:active .mi{transform:scale(.9)}
.menu-btn.disabled{
  filter:grayscale(.7) brightness(.6);
  cursor:not-allowed;
  opacity:.55;
}

/* 红色高亮按钮（战斗时出现） */
.menu-btn.danger{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#c03030,#801818 55%,#501010);
}
.menu-btn.danger .mt{color:#ffd0d0;text-shadow:0 1px 0 #000,0 0 6px rgba(255,80,80,.6)}

/* 带红点通知 */
.menu-btn.has-dot::after{
  content:'';position:absolute;top:3px;right:3px;
  width:8px;height:8px;
  background:radial-gradient(circle,#ff4040,#a01010);
  border:1px solid #400808;
  border-radius:50%;
  box-shadow:0 0 6px rgba(255,64,64,.8);
  animation:dotPulse 1.2s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.25)}
}

/* ================= 弹窗遮罩层 ================= */
.modal{
  position:absolute;inset:0;z-index:100;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(10,6,4,.72) 0%,
      rgba(4,2,1,.9) 100%);
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
  backdrop-filter:blur(2px);
}
.modal.show{
  opacity:1;pointer-events:auto;
}

/* ================= 通用弹窗容器 ================= */
.dialog{
  width:100%;max-width:440px;
  max-height:88%;
  display:flex;flex-direction:column;
  background:
    repeating-linear-gradient(92deg,
      rgba(0,0,0,.10) 0 2px,
      rgba(255,220,160,.03) 2px 5px,
      transparent 5px 9px),
    linear-gradient(180deg,#6b3a1a 0%,#4a2812 55%,#3a1f0e 100%);
  border:3px solid var(--wood-dark);
  border-radius:10px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,120,.28),
    inset 0 2px 6px rgba(255,220,160,.12),
    inset 0 -4px 10px rgba(0,0,0,.5),
    0 6px 24px rgba(0,0,0,.8),
    0 0 60px rgba(240,200,96,.1);
  transform:scale(.92) translateY(8px);
  transition:transform .25s cubic-bezier(.25,1.4,.5,1);
  overflow:hidden;
  position:relative;
}
.dialog::before{
  content:'';position:absolute;inset:5px;
  border:1px dashed rgba(240,200,96,.25);
  border-radius:6px;pointer-events:none;z-index:1;
}
.modal.show .dialog{
  transform:scale(1) translateY(0);
}

/* 弹窗头部（带卷轴标题） */
.dialog-head{
  flex-shrink:0;
  position:relative;
  padding:14px 40px 10px;
  text-align:center;
  background:
    linear-gradient(180deg,
      rgba(90,50,24,.6),
      rgba(40,20,8,.4));
  border-bottom:2px solid rgba(240,200,96,.22);
  box-shadow:inset 0 1px 0 rgba(240,200,96,.25);
}
.dialog-title{
  display:inline-block;
  padding:4px 26px;
  font-size:14px;font-weight:bold;
  letter-spacing:5px;
  color:#3a1f0e;
  background:
    linear-gradient(180deg,var(--gold-lt),var(--gold) 50%,var(--gold-dk));
  border:2px solid #6a4810;
  border-radius:13px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -2px 4px rgba(120,80,20,.4),
    0 2px 6px rgba(0,0,0,.5);
  text-shadow:0 1px 0 rgba(255,255,255,.55);
  position:relative;
}
.dialog-title::before,
.dialog-title::after{
  content:'❖';
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:10px;color:#6a4810;
}
.dialog-title::before{left:8px}
.dialog-title::after{right:8px}

/* 关闭按钮 */
.dialog-close{
  position:absolute;
  top:10px;right:10px;
  width:32px;height:32px;
  padding:0;
  font-family:inherit;
  font-size:16px;font-weight:bold;
  color:#ffe8a0;
  background:
    linear-gradient(180deg,#a83828,#681810);
  border:2px solid #2a0808;
  border-radius:50%;
  box-shadow:
    inset 0 1px 0 rgba(255,180,140,.5),
    inset 0 -2px 3px rgba(0,0,0,.5),
    0 2px 5px rgba(0,0,0,.6);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .08s;
  z-index:3;
  text-shadow:0 1px 0 #000;
}
.dialog-close:active{
  transform:translateY(2px);
  box-shadow:
    inset 0 1px 0 rgba(255,180,140,.5),
    inset 0 -1px 2px rgba(0,0,0,.5),
    0 0 0 rgba(0,0,0,.6);
}

/* 弹窗内容区 */
.dialog-body{
  flex:1;min-height:0;
  overflow-y:auto;
  padding:12px 14px;
  position:relative;z-index:2;
  scrollbar-width:thin;
  scrollbar-color:rgba(240,200,96,.45) rgba(0,0,0,.3);
}
.dialog-body::-webkit-scrollbar{width:8px}
.dialog-body::-webkit-scrollbar-track{
  background:rgba(0,0,0,.4);
  border-radius:4px;
}
.dialog-body::-webkit-scrollbar-thumb{
  background:
    linear-gradient(180deg,var(--gold),var(--gold-dk));
  border-radius:4px;
  border:1px solid #6a4810;
}

/* 弹窗底部按钮区 */
.dialog-foot{
  flex-shrink:0;
  padding:10px 14px 12px;
  display:flex;gap:8px;
  justify-content:center;
  background:
    linear-gradient(0deg,rgba(26,14,8,.6),transparent);
  border-top:1px solid rgba(240,200,96,.18);
  position:relative;z-index:2;
}

/* ================= 通用按钮 ================= */
.btn{
  flex:1;min-width:80px;
  padding:10px 14px;
  font-family:inherit;
  font-size:12.5px;font-weight:bold;
  letter-spacing:2px;
  color:#ffe8a0;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#8a5228,#5a3218 55%,#3a1f0e);
  border:2px solid #2a1608;
  border-radius:6px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -3px 5px rgba(0,0,0,.45),
    0 3px 0 #140a04,
    0 4px 7px rgba(0,0,0,.5);
  cursor:pointer;
  transition:all .07s;
  -webkit-user-select:none;
  text-shadow:0 1px 0 #000;
  position:relative;
}
.btn::before{
  content:'';position:absolute;inset:2px;
  border:1px solid rgba(240,200,96,.18);
  border-radius:4px;pointer-events:none;
}
.btn:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -1px 3px rgba(0,0,0,.45),
    0 0 0 #140a04,
    0 1px 3px rgba(0,0,0,.5);
}
.btn:disabled{
  filter:grayscale(.75) brightness(.55);
  cursor:not-allowed;
  opacity:.6;
}
/* 主按钮（金色） */
.btn.primary{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.06) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#f0c860,#c89020 55%,#8a6010);
  color:#3a1f0e;
  border-color:#6a4810;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -3px 5px rgba(120,80,20,.45),
    0 3px 0 #5a4010,
    0 4px 7px rgba(0,0,0,.5);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
.btn.primary::before{border-color:rgba(120,80,20,.3)}
/* 危险按钮（红色） */
.btn.danger{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#c03030,#801818 55%,#501010);
  color:#ffd0d0;
  border-color:#2a0808;
  box-shadow:
    inset 0 1px 0 rgba(255,180,140,.5),
    inset 0 -3px 5px rgba(0,0,0,.5),
    0 3px 0 #280808,
    0 4px 7px rgba(0,0,0,.5);
  text-shadow:0 1px 0 #000,0 0 5px rgba(255,80,80,.5);
}
/* 小按钮 */
.btn.small{
  flex:0 0 auto;
  min-width:auto;
  padding:6px 12px;
  font-size:11px;
  letter-spacing:1px;
  border-radius:5px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -2px 4px rgba(0,0,0,.45),
    0 2px 0 #140a04,
    0 3px 5px rgba(0,0,0,.45);
}
.btn.small:active{
  transform:translateY(2px);
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -1px 2px rgba(0,0,0,.45),
    0 0 0 #140a04,
    0 1px 2px rgba(0,0,0,.45);
}

/* ================= 列表项通用样式 ================= */
.list-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;
  margin-bottom:7px;
  background:
    linear-gradient(180deg,
      rgba(255,220,160,.08),
      rgba(0,0,0,.25));
  border:2px solid rgba(240,200,96,.22);
  border-radius:6px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.15),
    0 2px 4px rgba(0,0,0,.35);
  transition:all .12s;
  position:relative;
}
.list-item.clickable{
  cursor:pointer;
}
.list-item.clickable:active{
  background:
    linear-gradient(180deg,
      rgba(240,200,96,.22),
      rgba(0,0,0,.35));
  transform:translateX(2px);
  border-color:rgba(240,200,96,.5);
}
.list-item .li-icon{
  width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  background:
    radial-gradient(circle at 50% 35%,
      rgba(240,200,96,.25),transparent 70%),
    linear-gradient(180deg,rgba(90,50,24,.6),rgba(40,20,8,.6));
  border:1.5px solid rgba(240,200,96,.35);
  border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(240,200,96,.2);
}
.list-item .li-body{flex:1;min-width:0}
.list-item .li-name{
  font-size:12.5px;font-weight:bold;
  color:#ffe8a0;
  letter-spacing:.5px;
  text-shadow:0 1px 0 #000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.list-item .li-name .li-count{
  color:#f0c860;font-size:11px;margin-left:4px;
  font-weight:normal;
}
.list-item .li-desc{
  font-size:10.5px;color:#c0a870;
  margin-top:3px;line-height:1.5;
}
.list-item .li-desc b{color:#ff8060}
.list-item .li-desc i{font-style:normal;color:#80d0ff}
.list-item .li-right{
  flex-shrink:0;
  font-size:11px;
  color:#f0c860;
  text-align:right;
  white-space:nowrap;
}
.list-item .li-right small{
  display:block;
  color:#c0a870;font-size:9.5px;
  margin-top:2px;
}
.list-item .li-btn{
  flex-shrink:0;
  margin-left:6px;
  padding:6px 12px;
  font-family:inherit;
  font-size:11px;font-weight:bold;
  letter-spacing:1px;
  color:#3a1f0e;
  background:
    linear-gradient(180deg,#f0c860,#c89020 55%,#8a6010);
  border:2px solid #6a4810;
  border-radius:5px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -2px 4px rgba(120,80,20,.45),
    0 2px 0 #5a4010,
    0 3px 5px rgba(0,0,0,.45);
  cursor:pointer;
  transition:all .07s;
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
.list-item .li-btn:active{
  transform:translateY(2px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -1px 2px rgba(120,80,20,.45),
    0 0 0 #5a4010,
    0 1px 2px rgba(0,0,0,.45);
}
.list-item .li-btn:disabled{
  filter:grayscale(.8) brightness(.6);
  cursor:not-allowed;opacity:.6;
}

/* 稀有度光边 */
.list-item.rare-1{border-color:rgba(120,180,240,.5)}
.list-item.rare-1 .li-name{color:#80c0ff}
.list-item.rare-2{border-color:rgba(190,130,255,.55)}
.list-item.rare-2 .li-name{color:#d090ff}
.list-item.rare-3{
  border-color:rgba(255,180,60,.65);
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.2),
    0 0 12px rgba(255,180,60,.25),
    0 2px 4px rgba(0,0,0,.35);
}
.list-item.rare-3 .li-name{color:#ffd060}

/* ================= 空状态提示 ================= */
.empty-tip{
  text-align:center;
  padding:32px 12px;
  color:#8a7050;
  font-size:12px;
  letter-spacing:1px;
  text-shadow:0 1px 0 #000;
}
.empty-tip .ei{
  font-size:36px;
  display:block;
  margin-bottom:10px;
  opacity:.5;
  filter:grayscale(.5);
}

/* ================= 属性格子 ================= */
.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:10px;
}
.stat-box{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 11px;
  background:
    linear-gradient(180deg,
      rgba(255,220,160,.08),
      rgba(0,0,0,.28));
  border:1.5px solid rgba(240,200,96,.22);
  border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(240,200,96,.12);
  font-size:11.5px;
}
.stat-box .sk{
  color:#c0a870;
  display:flex;align-items:center;gap:4px;
  letter-spacing:.5px;
}
.stat-box .sk .ski{font-size:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.stat-box .sv{
  color:#ffe8a0;
  font-weight:bold;
  font-size:13px;
  text-shadow:0 1px 0 #000;
  letter-spacing:.3px;
}
.stat-box .sv small{
  color:#c0a870;font-weight:normal;
  font-size:10px;margin-left:2px;
}
.stat-box.gold .sv{color:#ffd060}
.stat-box.hp .sv{color:#ff8060}
.stat-box.mp .sv{color:#80c0ff}
.stat-box.exp .sv{color:#f0c860}

/* ================= 分区标题 ================= */
.section-title{
  display:flex;align-items:center;
  gap:8px;
  margin:12px 0 8px;
  font-size:11.5px;
  color:var(--gold-lt);
  letter-spacing:3px;
  font-weight:bold;
  text-shadow:0 1px 0 #000;
}
.section-title::before,
.section-title::after{
  content:'';
  flex:1;height:1px;
  background:linear-gradient(90deg,
    transparent,
    rgba(240,200,96,.5),
    transparent);
}
.section-title::before{
  background:linear-gradient(90deg,
    transparent,
    rgba(240,200,96,.5));
}
.section-title::after{
  background:linear-gradient(90deg,
    rgba(240,200,96,.5),
    transparent);
}
.section-title .sti{
  font-size:14px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));
}

/* ============================================================
   ↓↓↓ 第 3 批结束，第 4 批将接续：门派选择界面 / 战斗界面
   ============================================================ */


/* ============================================================
   响应式适配：手机竖屏 / 手机横屏 / 平板 / 电脑
   ============================================================ */
html,body{width:100%;min-width:0;}
#game{width:100%;max-width:none;height:100dvh;}

/* 电脑 / 大屏：采用宽屏游戏布局，避免原来的 640px 限制 */
@media (min-width: 900px){
  body{align-items:center;}
  #game{
    width:min(1180px,100vw);
    height:min(900px,100dvh);
    border-left:1px solid #241207;
    border-right:1px solid #241207;
  }
  #topbar{padding:7px 10px;gap:8px;}
  #bottomBar{padding:7px 12px 9px;gap:7px;}
  .menu-btn{min-height:58px;}
  .menu-btn .mi{font-size:22px;}
  #dpad{right:20px;bottom:20px;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);}
  #dpad button{font-size:24px;}
  #toast{bottom:120px;}
}

/* 手机竖屏：顶部信息、地图和底部菜单紧凑排列 */
@media (max-width: 899px) and (orientation: portrait){
  #topbar{min-height:72px;padding:4px 5px;gap:3px;}
  #portrait{width:50px;height:58px;}
  #pName{font-size:12px;max-width:78px;}
  #pSect{font-size:9px;padding:1px 5px;}
  .status-icons{gap:3px;font-size:8px;}
  #goldBox{min-width:54px;padding:4px 5px;}
  #stage{min-height:0;}
  #dpad{right:8px;bottom:8px;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:2px;}
  #dpad button{font-size:19px;}
  #miniMapBtn{top:8px;right:8px;}
  #bottomBar{padding:4px 5px 5px;gap:3px;}
  .menu-btn{min-height:50px;padding:4px 1px 3px;}
  .menu-btn .mi{font-size:18px;}
  .menu-btn .mt{font-size:9px;letter-spacing:0;}
  #sceneTitle{font-size:12px;padding:4px 10px;}
  #sceneBanner{font-size:16px;letter-spacing:4px;padding:8px 18px;max-width:90vw;white-space:nowrap;}
  #toast{bottom:78px;max-width:88vw;font-size:11px;}
}

/* 手机横屏：把竖向空间让给地图，顶部/底部进一步压缩 */
@media (max-width: 899px) and (orientation: landscape){
  #topbar{min-height:52px;height:52px;padding:3px 6px;gap:4px;}
  #portrait{width:42px;height:46px;}
  #pName{font-size:11px;max-width:90px;}
  #pSect{font-size:8px;padding:0 5px;}
  .status-icons{font-size:7px;gap:3px;}
  #goldBox{min-width:58px;padding:2px 5px;}
  #stage{min-height:0;}
  #dpad{right:8px;bottom:6px;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:2px;}
  #dpad button{font-size:17px;}
  #miniMapBtn{top:6px;right:7px;}
  #bottomBar{height:54px;padding:3px 6px 4px;gap:3px;}
  .menu-btn{min-height:45px;padding:2px 1px;}
  .menu-btn .mi{font-size:16px;}
  .menu-btn .mt{font-size:8px;letter-spacing:0;}
  #toast{bottom:62px;max-width:70vw;font-size:10px;}

function hash(c, r, salt){
  let h = (Math.imul(c|0, 73856093) ^ Math.imul(r|0, 19349663) ^ Math.imul(salt|0, 83492791)) >>> 0;
  h ^= h >>> 15;
  h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h / 4294967296;
}
function noise2(x, y, salt){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi, salt);
  const b = hash(xi+1, yi, salt);

  return (a*(1-sx) + b*sx)*(1-sy) + (c*(1-sx) + d*sx)*sy;
}

/* 经验公式 */
function expNeed(){
  return Math.floor(60 * Math.pow(P.lv, 1.65));
}

/* 获得经验 */
function gainExp(amount){
  P.exp += amount;
  let leveled = false;
  while (P.exp >= expNeed()){
    P.exp -= expNeed();
    P.lv++;
    const s = SECTS.find(x => x.id === P.sect);
    if (s){
      P.maxHp += Math.floor(s.grow.hp);
      P.maxMp += Math.floor(s.grow.mp);
      P.atk   += Math.floor(s.grow.atk);
      P.def   += Math.floor(s.grow.def);
      P.spd   += Math.floor(s.grow.spd);
      P.magic += Math.floor(s.grow.magic);
      P.hp = P.maxHp;
      P.mp = P.maxMp;
    }
    leveled = true;
    // 检查新技能
    const skills = getSectSkills().filter(sk => sk.lv === P.lv);
    skills.forEach(sk => {
      toast(`📖 领悟了【${sk.name}】！`);
      addLog(`【升级】领悟新技能：${sk.name}`, 'good');
    });
  }
  if (leveled){
    toast(`🌟 等级提升！当前 Lv.${P.lv}`);
    updateHUD();
  }
}

/* 获取门派技能 */
function getSectSkills(){
  if (!P.sect) return [];
  const s = SECTS.find(x => x.id === P.sect);
  return s ? s.skills.filter(sk => sk.lv <= P.lv) : [];
}

function chooseSect(id){
  const s = SECTS.find(x => x.id === id);
  if (!s) return;
  
  P.sect = id;
  P.maxHp = s.base.hp;
  P.maxMp = s.base.mp;
  P.atk   = s.base.atk;
  P.def   = s.base.def;
  P.spd   = s.base.spd;
  P.magic = s.base.magic;
  P.hp = P.maxHp;
  P.mp = P.maxMp;
  
  $('modalSect').classList.remove('show');
  $('pSect').textContent = s.name;
  
  toast(`🎋 你拜入了 ${s.name}，从此踏上修仙之路`);
  addLog(`【门派】拜入 ${s.name}`, 'good');
  addLog(`【提示】使用方向键在长安城中行走，前往野外历练。`, 'dim');
  
  updateHUD();
  renderWorld();
  startGameLoop();
}

      <button class="btn small ${bagFilter==='gem'?'primary':''}" data-filter="gem">宝石</button>
      <button class="btn small ${bagFilter==='exp'?'primary':''}" data-filter="exp">修炼</button>
      <button class="btn small ${bagFilter==='special'?'primary':''}" data-filter="special">特殊</button>
    </div>
  `;
  
  // 过滤
  let displayKeys = keys;
  if (bagFilter !== 'all'){
    displayKeys = keys.filter(k => ITEMS[k] && ITEMS[k].type === bagFilter);
  }
  
  if (!displayKeys.length){
    html += `<div class="empty-tip"><span class="ei">🎒</span>${keys.length?'此分类下暂无物品':'背包空空如也'}</div>`;
  } else {
    html += '<div id="bagItems"></div>';
  }
  
  body.innerHTML = html;
  
  // 绑定过滤按钮
  body.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      bagFilter = btn.dataset.filter;
      renderBagPanel();
    });
  });
  
  // 渲染物品
  if (displayKeys.length){
    const list = body.querySelector('#bagItems');
    displayKeys.forEach(id => {
      const it = ITEMS[id];
      if (!it) return;
      const rare = it.rare || 0;
      const itEl = document.createElement('div');
      itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
      itEl.innerHTML = `
        <div class="li-icon" style="font-size:22px">${it.icon}</div>
        <div class="li-body">
          <div class="li-name">${it.name}<span class="li-count">×${P.bag[id]}</span></div>
          <div class="li-desc">${it.desc}</div>
        </div>
      `;
      const btn = document.createElement('button');
      btn.className = 'li-btn';
      btn.textContent = it.type === 'gem' ? '镶嵌' : '使用';
      btn.addEventListener('click', () => {
        useItem(id);
        renderBagPanel();
      });
      itEl.appendChild(btn);
      list.appendChild(itEl);
    });
  }
}

/* 使用物品 */
function useItem(id){
  if (!P.bag[id] || P.bag[id] <= 0) return;
  const it = ITEMS[id];
  if (!it || !it.use) return;
  
  const result = it.use();
  P.bag[id]--;
  if (P.bag[id] <= 0) delete P.bag[id];
  
  toast(`${it.icon} ${it.name}：${result}`);
  addLog(`【使用】${it.name} · ${result}`, 'good');
  updateHUD();
  renderWorld();
}

/* ============================================================
   梦幻西游 · Q版像素单机  —— 第 6 批
   世界生成 / 地形渲染 / 玩家移动 / 场景切换

/* ================= 常量 ================= */
const TILE = 52;                 // 每个格子像素（放大地图显示）
const VIEW_PAD = 3;              // 视口外多渲染几格
const world = $('world');
const stage = $('stage');

/* ================= 场景定义（区域中心） ================= */
const SCENES = [
  { id:'changan',  name:'长安城',    cx:0,   cy:0,   radius:18, lv:1,  danger:0,
    biome:'town',    desc:'大唐国都，繁华似锦' },
  { id:'jiangnan', name:'江南野外',  cx:0,   cy:-55, radius:34, lv:5,  danger:3,
    biome:'plain',   desc:'鱼米之乡，草木葱茏' },
  { id:'datang',   name:'大唐境外',  cx:75,  cy:-40, radius:38, lv:11, danger:5,
    biome:'desert',  desc:'黄沙漫天，商旅难行' },
  { id:'beiju',    name:'北俱芦洲',  cx:-75, cy:-50, radius:42, lv:17, danger:7,
    biome:'snow',    desc:'冰雪覆盖的极北之地' },
  { id:'huoyan',   name:'火焰山',    cx:0,   cy:95,  radius:40, lv:26, danger:9,
    biome:'volcano', desc:'烈焰熊熊，寸草不生' },
];

/* ================= 地形缓存 ================= */
const tileCache = new Map();

/* 判断某坐标属于哪个场景 */
function getSceneAt(x, y){
  let best = null, bestD = Infinity;
  for (const s of SCENES){
    const d = Math.hypot(x - s.cx, y - s.cy);
    if (d < s.radius && d < bestD){ best = s; bestD = d; }
  }
  return best;
}

/* 判断是否城镇（长安城） */
function isTown(x, y){
  const d = Math.hypot(x, y);
  return d < 10;
}

/* ================= 生成瓦片 ================= */
function getTile(x, y){
  const key = x + ',' + y;
  if (tileCache.has(key)) return tileCache.get(key);
  
  const scene = getSceneAt(x, y);
  const distOrigin = Math.hypot(x, y);
  let tile;
  
  if (isTown(x, y)){
    /* ---- 长安城 ---- */
    const dt = Math.hypot(x, y);
    if (dt < 4.5){
      // 中心广场
      tile = (Math.abs(x) < 1 && Math.abs(y) < 1) ? 'floor-center' : 'floor';
      // 中心石碑
      if (x === 0 && y === -2) tile = 'build-memorial';
      // 摊位
      if ((x === -3 && y === 1) || (x === 3 && y === 1)) tile = 'build-stall';
    } else if (dt < 8){
      // 内城街区
      const n = noise2(x*0.5, y*0.5, 11);
      if (n > 0.78) tile = 'build-house';
      else if (n > 0.7)  tile = 'build-shop';
      else if (n < 0.2)  tile = 'path';
      else tile = 'floor';
    } else {
      // 外城墙 + 城门
      if (dt < 10.5){
        const angle = Math.atan2(y, x);
        // 四座城门
        const gateAngles = [0, Math.PI/2, Math.PI, -Math.PI/2];
        let isGate = false;
        for (const ga of gateAngles){
          if (Math.abs(angle - ga) < 0.18) { isGate = true; break; }
        }
        if (isGate) tile = 'path';
        else if (Math.abs(dt - 9.5) < 0.6) tile = 'wall';
        else tile = 'floor';
      } else {
        tile = 'grass';
      }
    }
  } else if (scene){
    /* ---- 野外场景 ---- */
    const biome = scene.biome;
    const n1 = noise2(x*0.18, y*0.18, 21);
    const n2 = noise2(x*0.32, y*0.32, 22);
    const n3 = noise2(x*0.09, y*0.09, 23);
    
    // 场景边缘淡出
    const d = Math.hypot(x - scene.cx, y - scene.cy);
    const edge = clamp(1 - (d - scene.radius*0.7) / (scene.radius*0.3), 0, 1);
    
    if (biome === 'plain'){
      if (n3 > 0.90) tile = 'water';
      else if (n1 > 0.80) tile = 'tree';
      else if (n1 < 0.12) tile = 'flower';
      else if (n2 > 0.88)  tile = 'rock';
      else tile = n2 > 0.5 ? 'grass' : 'grass2';
    } else if (biome === 'desert'){
      if (n1 > 0.90) tile = 'rock';
      else if (n1 < 0.05) tile = 'tree'; // 仙人掌用树代替
      else if (n3 > 0.94) tile = 'water';
      else tile = 'sand';
    } else if (biome === 'snow'){
      if (n1 > 0.86) tile = 'tree';
      else if (n2 > 0.91) tile = 'rock';
      else if (n3 > 0.95) tile = 'water';
      else tile = 'snow';
    } else if (biome === 'volcano'){
      if (n3 > 0.88) tile = 'lava';
      else if (n1 > 0.82) tile = 'rock';
      else tile = 'sand'; // 焦土
    }
    // 场景外圈淡出为草地
    if (edge < 1 && hash(x, y, 991) > 0.5) tile = 'grass';
  } else {
    /* ---- 荒野过渡区 ---- */
    const n1 = noise2(x*0.14, y*0.14, 31);
    const n2 = noise2(x*0.3, y*0.3, 32);
    if (n1 > 0.88) tile = 'tree';
    else if (n1 < 0.06) tile = 'water';
    else if (n2 > 0.88) tile = 'rock';
    else if (n2 < 0.2) tile = 'flower';
    else tile = (n2 > 0.5) ? 'grass' : 'grass2';
  }
  
  tileCache.set(key, tile);
  return tile;
}

/* ================= 建筑/NPC装饰图标 ================= */
const TILE_ICON = {
  'build-memorial': { icon:'🏛️', name:'长安石碑', type:'npc',  action:'readMemorial' },
  'build-stall':    { icon:'🏪', name:'杂货摊',   type:'shop',  action:'openShop' },
  'build-house':    { icon:'🏠', name:'民宅',     type:'build', action:null },
  'build-shop':     { icon:'🏦', name:'钱庄',     type:'build', action:null },
};

/* 场景装饰图标（随机散落） */
function getDecor(x, y, tile){
  if (tile === 'tree')   return '🌲';
  if (tile === 'rock')   return '🪨';
  if (tile === 'flower') return '🌺';
  if (tile === 'water')  return '';
  if (tile === 'sand' && hash(x,y,88) > 0.9) return '🌵';
  if (tile === 'lava')   return '🔥';
  if (tile === 'snow' && hash(x,y,89) > 0.92) return '❄️';
  return '';
}

/* ================= 判断是否可走 ================= */
function isWalkable(x, y){
  // 严格执行：只有水面不可走，其余所有地形都可走。
  return getTile(x, y) !== 'water';
}

/* ================= 野外地图怪物 =================
   怪物直接显示在地图上，不占用碰撞格。
   使用固定哈希，让同一坐标在重绘后仍显示同一种怪物。
*/
function getMapMonster(x, y){
  if (isTown(x, y)) return null;
  if (getTile(x, y) === 'water') return null;

  // 控制怪物密度：约每 8x8 格出现一个显示点
  const h = hash(x, y, 701);
  if (h < 0.84) return null;

  const scene = getSceneAt(x, y);
  let pool;
  if (!scene){
    pool = ['lang','shanzei','liukou'];
  } else if (scene.id === 'jiangnan'){
    pool = ['shuyao','chimang','linghu'];
  } else if (scene.id === 'datang'){
    pool = ['shamo','shadao','xieyan'];
  } else if (scene.id === 'beiju'){
    pool = ['xuelang','bingpo','xuenv'];
  } else if (scene.id === 'huoyan'){
    pool = ['huoya','rongyan','yanmo'];
  } else {
    pool = ['lang'];
  }

  const index = Math.floor(hash(x, y, 702) * pool.length) % pool.length;
  return MOBS[pool[index]] || null;
}

/* ================= 怪物地图图片 ================= */
function makeMonsterImage(mob){
  // 使用内嵌 SVG 生成独立图片，不依赖网络图片地址，手机和电脑都能显示。
  const colors = {
    lang:['#6b4a2f','#d7a36b'], shanzei:['#5b3b25','#c88a4a'], liukou:['#3a2930','#9b5960'],
    shuyao:['#2f6b35','#7fbe58'], chimang:['#8d2d32','#e26b57'], linghu:['#b86b35','#ffd18a'],
    shamo:['#806238','#d6ad6b'], shadao:['#70452c','#d79b58'], xieyan:['#7b2b1e','#ff7a45'],
    xuelang:['#53677a','#dcecff'], bingpo:['#3c78a8','#a9eaff'], xuenv:['#53608f','#e6edff'],
    huoya:['#8a3d22','#ffb13b'], rongyan:['#4f3328','#ff6b3d'], yanmo:['#4a2028','#ff4f4f']
  };
  const c = colors[mob.id] || ['#4b4b4b','#dddddd'];
  const icon = String(mob.icon || '👾').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const svg = `<svg xmlns=\"http://www.w3.org/2000/svg\" width=48 height=48 viewBox=\"0 0 48 48\">`+
    `<rect x=2 y=2 width=44 height=44 rx=7 fill=\"${c[0]}\" stroke=\"#160d08\" stroke-width=3/>`+
    `<circle cx=24 cy=23 r=16 fill=\"${c[1]}\" opacity=\".92\"/>`+
    `<text x=24 y=31 text-anchor=\"middle\" font-size=23 font-family=\"Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif\">${icon}</text>`+
    `<path d=\"M10 39h28\" stroke=\"#fff\" stroke-opacity=\".25\" stroke-width=2/>`+
    `</svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

/* ================= 渲染世界 ================= */
let lastRenderX = null, lastRenderY = null;
let cameraX = 0, cameraY = 0;

function renderWorld(){
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  if (!vw || !vh) return;
  
  // 玩家居中：以玩家为中心渲染
  const cols = Math.ceil(vw / TILE) + VIEW_PAD * 2;
  const rows = Math.ceil(vh / TILE) + VIEW_PAD * 2;
  const startX = P.x - Math.floor(cols / 2);
  const startY = P.y - Math.floor(rows / 2);
  
  // 关键修复：让“逻辑坐标”与“屏幕上的格子”严格对齐。
  // 之前格子直接从 0,0 排列，玩家虽然固定在屏幕正中央，但 P.x/P.y 对应的格子
  // 实际并不在玩家脚下，导致画面看着是草地，程序却判断目标格是水。
  const gridLeft = Math.round(vw / 2 - (P.x - startX + 0.5) * TILE);
  const gridTop  = Math.round(vh / 2 - (P.y - startY + 0.5) * TILE);
  
  const frag = document.createDocumentFragment();
  
  for (let dy = 0; dy < rows; dy++){
    for (let dx = 0; dx < cols; dx++){
      const wx = startX + dx;
      const wy = startY + dy;
      const tile = getTile(wx, wy);
      
      const el = document.createElement('div');
      el.className = 'tile t-' + tile;
      el.style.left = (gridLeft + dx * TILE) + 'px';
      el.style.top  = (gridTop + dy * TILE) + 'px';
      el.style.width  = TILE + 'px';
      el.style.height = TILE + 'px';
      
      // 建筑装饰图标
      if (TILE_ICON[tile]){
        const span = document.createElement('span');
        span.className = TILE_ICON[tile].type === 'npc' || TILE_ICON[tile].type === 'shop' ? 'npc' : 'build';
        span.textContent = TILE_ICON[tile].icon;
        el.appendChild(span);
        el.dataset.tileType = tile;
        el.dataset.wx = wx;
        el.dataset.wy = wy;
        el.style.cursor = 'pointer';
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          onTileClick(wx, wy, tile);
        });
      } else {
        const deco = getDecor(wx, wy, tile);
        if (deco){
          const span = document.createElement('span');
          span.className = 'deco';
          span.textContent = deco;
          el.appendChild(span);
        }
      }

      // 地图上直接显示怪物图片和名称；怪物不阻挡玩家移动
      const mapMob = getMapMonster(wx, wy);
      if (mapMob && !(wx === P.x && wy === P.y)){
        const mobEl = document.createElement('div');
        mobEl.className = 'map-monster';
        mobEl.title = `${mapMob.name} Lv.${mapMob.lv}`;
        const img = document.createElement('img');
        img.className = 'map-monster-img';
        img.alt = mapMob.name;
        img.src = makeMonsterImage(mapMob);
        const name = document.createElement('span');
        name.className = 'map-monster-name';
        name.textContent = `${mapMob.name} Lv.${mapMob.lv}`;
        mobEl.appendChild(img);
        mobEl.appendChild(name);
        el.appendChild(mobEl);
      }
      
      frag.appendChild(el);
    }
  }
  
  world.innerHTML = '';
  world.appendChild(frag);
  
  // 玩家角色
  renderPlayer(vw, vh);
  
  // 更新场景标题
  updateSceneTitle();
  
  lastRenderX = P.x;
  lastRenderY = P.y;
}

/* ================= 移动系统 ================= */
let moveLock = false;

function tryMove(dx, dy){
  // 地图移动的唯一地形碰撞规则：水面。
  // 战斗界面显示时由战斗界面本身拦截输入；战斗结束后不再使用残留状态锁死地图。
  const battleOverlay = $('battleOverlay');
  if (battleOverlay && battleOverlay.classList.contains('show')) return;

  // 只允许四方向单格移动。
  dx = Math.sign(Number(dx) || 0);
  dy = Math.sign(Number(dy) || 0);
  if (dx === 0 && dy === 0) return;
  if (dx !== 0 && dy !== 0) return;

  const nx = P.x + dx;
  const ny = P.y + dy;
  const targetTile = getTile(nx, ny);

  // 唯一碰撞规则：水。
  // grass / grass2 / flower / tree / rock / sand / snow / lava / 建筑等全部允许通行。
  if (targetTile === 'water'){
    toast('🌊 水面无法通行');
    return;
  }
  
  const prevScene = getSceneAt(P.x, P.y);
  
  P.x = nx;
  P.y = ny;
  P.steps++;
  
  // 行走动画
  const pEl = $('player');
  if (pEl){
    pEl.classList.add('walking');
    clearTimeout(pEl._walkTimer);
    pEl._walkTimer = setTimeout(() => pEl.classList.remove('walking'), 300);
  }
  
  renderWorld();
  updateHUD();
  
  // 检查场景切换
  const curScene = getSceneAt(P.x, P.y);
  if (curScene && curScene !== prevScene){
    showBanner(curScene.name);
    addLog(`【场景】进入 ${curScene.name}（Lv.${curScene.lv}）`, 'dim');
    toast(`📍 ${curScene.name} · ${curScene.desc}`);
  } else if (!curScene && prevScene){
    showBanner('荒野');
    addLog(`【场景】进入荒野地带`, 'dim');
  }
  
  // 步数事件
  onStep(nx, ny);
}

/* ================= 每一步的随机事件 ================= */
function onStep(x, y){
  const scene = getSceneAt(x, y);
  
  // 城镇内不遇敌
  if (isTown(x, y)) return;
  
  // 每 8 步自动回血回蓝
  if (P.steps % 8 === 0){
    if (P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + Math.floor(P.maxHp * 0.03));
    if (P.mp < P.maxMp) P.mp = Math.min(P.maxMp, P.mp + Math.floor(P.maxMp * 0.05));
    updateHUD();
  }
  
  // 遇敌概率
  let encounterRate = 0.08;
  if (scene) encounterRate += scene.danger * 0.012;
  encounterRate = clamp(encounterRate, 0.05, 0.25);
  
  // 每走3步才检测一次（避免太快遇敌）
  if (P.steps % 3 !== 0) return;
  if (Math.random() > encounterRate) return;
  
  // 触发战斗
  startEncounter(scene);
}

/* ================= 触发遭遇战 ================= */
function startEncounter(scene){
  // 选择怪物
  let pool;
  if (!scene){
    pool = ['lang', 'shanzei', 'liukou'];
  } else if (scene.id === 'jiangnan'){
    pool = ['shuyao', 'chimang', 'linghu'];
  } else if (scene.id === 'datang'){
    pool = ['shamo', 'shadao', 'xieyan'];
  } else if (scene.id === 'beiju'){
    pool = ['xuelang', 'bingpo', 'xuenv'];
  } else if (scene.id === 'huoyan'){
    pool = ['huoya', 'rongyan', 'yanmo'];
  } else {
    pool = ['lang'];
  }
  
  // 随机数量
  const count = Math.random() < 0.5 ? 1 : (Math.random() < 0.85 ? 2 : 3);
  const mobs = [];
  for (let i = 0; i < count; i++){
    const id = pool[Math.floor(Math.random() * pool.length)];
    const mob = JSON.parse(JSON.stringify(MOBS[id]));
    // 等级浮动
    const lvOffset = Math.floor(Math.random() * 3) - 1;
    mob.lv = Math.max(1, mob.lv + lvOffset);
    // 属性缩放
    const scale = 1 + (lvOffset * 0.08);
    mob.hp = Math.floor(mob.hp * scale);
    mob.atk = Math.floor(mob.atk * scale);
    mob.maxHp = mob.hp;
    mobs.push(mob);
  }
  
  // 准备战斗
  if (typeof battlePrepare === 'function'){
    battlePrepare(mobs);
  } else {
    toast('⚔️ 遭遇敌人！');
  }
}

  if (dist > 2.2){

  if (info.action === 'readMemorial'){

    addLog('【石碑】三界同心，共御妖魔', 'dim');

}

/* ================= 方向键绑定 ================= */
$$('#dpad button').forEach(btn => {
  const dir = btn.dataset.dir;
  if (!dir) return;
  let lastMoveAt = 0;
  const move = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const now = Date.now();
    if (now - lastMoveAt < 80) return;
    lastMoveAt = now;
    if (dir === 'up')    tryMove(0, -1);
    if (dir === 'down')  tryMove(0, 1);
    if (dir === 'left')  tryMove(-1, 0);
    if (dir === 'right') tryMove(1, 0);
  };
  btn.addEventListener('click', move);
  btn.addEventListener('pointerup', move);
});

/* 键盘移动 */
const keyMap = {
  'w':'up','W':'up','ArrowUp':'up',
  's':'down','S':'down','ArrowDown':'down',
  'a':'left','A':'left','ArrowLeft':'left',
  'd':'right','D':'right','ArrowRight':'right',
};
document.addEventListener('keydown', e => {
  // 弹窗打开时忽略
  if (document.querySelector('.modal.show')) return;
  if (typeof battle !== 'undefined' && battle && battle.active) return;
  const dir = keyMap[e.key];
  if (!dir) return;
  e.preventDefault();
  if (dir === 'up')    tryMove(0, -1);
  if (dir === 'down')  tryMove(0, 1);
  if (dir === 'left')  tryMove(-1, 0);
  if (dir === 'right') tryMove(1, 0);
});

/* 触摸滑动 */
let touchStartPt = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  touchStartPt = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive:true });

stage.addEventListener('touchend', e => {
  if (!touchStartPt) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartPt.x;
  const dy = t.clientY - touchStartPt.y;
  const dist = Math.hypot(dx, dy);
  const dur = Date.now() - touchStartPt.t;
  touchStartPt = null;
  
  if (dist < 24 || dur > 800) return;
  if (typeof battle !== 'undefined' && battle && battle.active) return;
  if (document.querySelector('.modal.show')) return;
  
  if (Math.abs(dx) > Math.abs(dy)){
    tryMove(dx > 0 ? 1 : -1, 0);
  } else {
    tryMove(0, dy > 0 ? 1 : -1);
  }
}, { passive:true });

/* ==================== 战斗状态 ==================== */
const battle = {
  active: false,
  units: [],       // 所有单位
  round: 0,
  over: false,
  victory: false,
  fled: false,
  overlay: null,
  scene: null,
  loopRunning: false,
  token: 0,
};

/* 创建战斗界面 DOM */
function createBattleUI(){
  if (battle.overlay) return battle.overlay;
  
  const overlay = document.createElement('div');
  overlay.id = 'battleOverlay';
  overlay.innerHTML = `
    <div class="battle-scene">
      <div class="battle-row enemy" id="enemyRow"></div>
      <div id="battleLog"></div>
      <div class="battle-row player" id="playerRow"></div>
      <div class="turn-banner" id="turnBanner"></div>
      <div class="result-banner" id="resultBanner"></div>
    </div>
    <div id="battleActions"></div>
  `;
  document.getElementById('stage').appendChild(overlay);
  battle.overlay = overlay;
  return overlay;
}

/* ==================== 战斗日志 ==================== */
function blog(text, cls = ''){
  const el = $('battleLog');
  if (!el) return;
  const d = document.createElement('div');
  d.className = 'blog ' + cls;
  d.innerHTML = text;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 80) el.removeChild(el.firstChild);
}

/* ==================== 伤害计算 ==================== */
function calcDamage(attacker, defender, power, type){
  // 攻击方主属性
  const atkStat = (type === 'magic') ? (attacker.magic || attacker.atk) : attacker.atk;
  // 防御减免系数（物理被防御更多减免）
  const defFactor = (type === 'magic') ? 0.4 : 0.7;
  
  const base = atkStat * power * (0.9 + Math.random() * 0.2);
  const reduction = defender.def * defFactor;
  let dmg = Math.max(1, base - reduction);
  
  // 暴击
  const crit = Math.random() < 0.12;
  if (crit) dmg *= 1.6;
  
  // 防御姿态减伤50%
  if (defender.guard){
    dmg *= 0.5;
  }
  
  return { dmg: Math.floor(dmg), crit };
}

/* ==================== 单位卡片渲染 ==================== */
function battleUnitCard(u){
  const hpPct = clamp(u.hp / u.maxHp * 100, 0, 100);
  const cls = [
    'battle-unit',
    u.isPlayer ? 'is-player' : '',
    u.isPet ? 'is-pet' : '',
    !u.alive ? 'dead' : '',
    u.acting ? 'acting' : '',
  ].filter(Boolean).join(' ');
  
  const statusIcons = [];
  if (u.stun && u.stun > 0) statusIcons.push(`<span>💫定身${u.stun}</span>`);
  if (u.guard) statusIcons.push(`<span>🛡️防御</span>`);
  
  return `
    <div class="${cls}" data-uid="${u.id}">
      <div class="bu-head">
        <div class="bu-icon">${u.icon || (u.isPlayer ? '🧝' : '👹')}</div>
        <div class="bu-name">${u.name}${u.lv ? `<small>Lv.${u.lv}</small>` : ''}</div>
      </div>
      <div class="bu-hp">
        <div class="fill" style="width:${hpPct}%"></div>
      </div>
      <div class="bu-hp-text">${Math.max(0, Math.ceil(u.hp))}/${u.maxHp}</div>
      ${statusIcons.length ? `<div class="bu-status">${statusIcons.join('')}</div>` : ''}
    </div>
  `;
}

function renderBattleUnits(){
  const enemyRow = $('enemyRow');
  const playerRow = $('playerRow');
  if (!enemyRow || !playerRow) return;
  
  enemyRow.innerHTML = battle.units.filter(u => u.isEnemy).map(battleUnitCard).join('');
  playerRow.innerHTML = battle.units.filter(u => !u.isEnemy).map(battleUnitCard).join('');
}

/* 显示飘字 */
function showDamageFloat(uid, text, cls = ''){
  const card = document.querySelector(`.battle-unit[data-uid="${uid}"]`);
  if (!card) return;
  const f = document.createElement('div');
  f.className = 'dmg-float ' + cls;
  f.textContent = text;
  card.style.position = 'relative';
  card.appendChild(f);
  setTimeout(() => f.remove(), 1100);
}

/* 单位受击抖动 */
function shakeUnit(uid){
  const card = document.querySelector(`.battle-unit[data-uid="${uid}"]`);
  if (!card) return;
  card.classList.remove('damaged');
  void card.offsetWidth;
  card.classList.add('damaged');
  setTimeout(() => card.classList.remove('damaged'), 350);
}

/* ==================== 战斗准备 ==================== */
function battlePrepare(mobs){
  const overlay = createBattleUI();
  battle.active = true;
  battle.over = false;
  battle.victory = false;
  battle.fled = false;
  battle.round = 0;
  battle.loopRunning = false;
  battle.token++;
  const battleToken = battle.token;
  
  // 收集场景信息
  battle.scene = getSceneAt(P.x, P.y);
  
  // 组装单位
  const units = [];
  
  // 玩家
  units.push({
    id: 'player',
    name: P.name,
    icon: '🧝',
    isPlayer: true,
    hp: P.hp, maxHp: P.maxHp,
    mp: P.mp, maxMp: P.maxMp,
    atk: P.atk, def: P.def, spd: P.spd, magic: P.magic,
    alive: true, stun: 0, guard: false, acting: false,
  });
  
  // 召唤兽
  if (P.pet){
    units.push({
      id: 'pet',
      name: P.pet.name,
      icon: P.pet.icon,
      isPet: true,
      hp: P.pet.hp, maxHp: P.pet.maxHp,
      mp: 0, maxMp: 0,
      atk: P.pet.atk, def: P.pet.def, spd: P.pet.spd,
      alive: true, stun: 0, guard: false, acting: false,
    });
  }
  
  // 怪物
  mobs.forEach((m, i) => {
    units.push({
      id: 'e' + i,
      name: m.name,
      icon: m.icon,
      isEnemy: true,
      lv: m.lv,
      hp: m.hp, maxHp: m.maxHp,
      mp: 0, maxMp: 0,
      atk: m.atk, def: m.def, spd: m.spd, magic: m.atk,
      skills: m.skills || [],
      exp: m.exp || 30, gold: m.gold || 15,
      alive: true, stun: 0, guard: false, acting: false,
    });
  });
  
  battle.units = units;
  
  // 显示战斗界面
  overlay.classList.remove('fading');
  overlay.classList.add('show');
  $('battleLog').innerHTML = '';
  $('battleActions').innerHTML = '';
  $('resultBanner').classList.remove('show');
  
  renderBattleUnits();
  
  // 战斗开场提示
  const mobNames = mobs.map(m => `${m.icon}${m.name}`).join(' ');
  blog(`⚔️ 遭遇 <b>${mobNames}</b>！`, 'warn');
  
  // 短暂延迟后开始
  setTimeout(() => {
    if (battle.active && battle.token === battleToken && !battle.loopRunning){
      battleLoop(battleToken);
    }
  }, 500);
}

/* ==================== 战斗主循环 ==================== */
async function battleLoop(token = battle.token){
  if (battle.loopRunning) return;
  battle.loopRunning = true;
  try {
    while (battle.active && token === battle.token && !battle.over && battle.round < 30){
    battle.round++;
    
    // 回合提示
    showTurnBanner(`第 ${battle.round} 回合`);
    blog(`—— 第 ${battle.round} 回合 ——`, 'round');
    await sleep(700);
    
    // 清除回合开始状态
    battle.units.forEach(u => u.guard = false);
    
    // 按速度排序
    const order = battle.units
      .filter(u => u.alive)
      .sort((a, b) => (b.spd - a.spd) + (Math.random() - 0.5) * 3);
    
    for (const u of order){
      if (!u.alive || battle.over) continue;
      
      // 定身检查
      if (u.stun > 0){
        u.stun--;
        u.acting = true;
        renderBattleUnits();
        blog(`💫 <b>${u.name}</b> 被定身，无法行动。`, 'dim');
        await sleep(450);
        u.acting = false;
        renderBattleUnits();
        continue;
      }
      
      u.acting = true;
      renderBattleUnits();
      await sleep(200);
      
      if (u.isPlayer){
        await playerTurn(u);
      } else if (u.isPet){
        await petTurn(u);
      } else {
        await monsterTurn(u);
      }
      
      u.acting = false;
      renderBattleUnits();
      checkBattleEnd();
      
      if (battle.over) break;
      await sleep(300);
    }
  }
  
    // 战斗结束后必须进入结算界面
    if (token !== battle.token) return;
    if (battle.over){
      if (battle.fled) finishBattle('flee');
      else if (battle.victory) finishBattle('victory');
      else finishBattle('defeat');
    } else if (battle.active){
      // 超过30回合，平局
      blog('⏳ 战斗超时，双方各自收手。', 'dim');
      battle.over = true;
      finishBattle('draw');
    }
  } finally {
    if (token === battle.token) battle.loopRunning = false;
  }
}

/* ==================== 玩家回合 ==================== */
function playerTurn(unit){
  return new Promise(resolve => {
    if (!battle.active || battle.over || !unit || !unit.alive){
      resolve();
      return;
    }
    const actions = $('battleActions');
    actions.innerHTML = '';
    
    // 主菜单：攻击 / 技能 / 防御 / 逃跑 / 物品
    const mainMenu = [
      { key:'attack',  name:'普通攻击', icon:'⚔️', cls:'basic' },
      { key:'skill',   name:'施放技能', icon:'✨', cls:'' },
      { key:'item',    name:'使用物品', icon:'🧪', cls:'item' },
      { key:'defend',  name:'防御',     icon:'🛡️', cls:'defend' },
      { key:'flee',    name:'逃跑',     icon:'💨', cls:'flee' },
      { key:'auto',    name:'自动战斗', icon:'🤖', cls:'basic' },
    ];
    
    mainMenu.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'battle-skill ' + m.cls;
      btn.innerHTML = `<span class="bs-name">${m.icon} ${m.name}</span>`;
      btn.addEventListener('click', () => {
        actions.innerHTML = '';
        handlePlayerAction(unit, m.key, resolve);
      });
      actions.appendChild(btn);
    });
  });
}

function handlePlayerAction(unit, action, resolve){
  const actions = $('battleActions');
  
  if (action === 'attack'){
    // 选择目标（多个时）
    const enemies = battle.units.filter(u => u.alive && u.isEnemy);
    if (enemies.length === 1){
      performAttack(unit, enemies[0], 1.0, 'phys', resolve);
    } else {
      showTargetSelect(enemies, (target) => {
        performAttack(unit, target, 1.0, 'phys', resolve);
      });
    }
  } else if (action === 'skill'){
    showSkillMenu(unit, resolve);
  } else if (action === 'item'){
    showItemMenu(unit, resolve);
  } else if (action === 'defend'){
    // 防御必须明确结束当前玩家回合；使用微任务交接，避免首次战斗时
    // 同步 resolve 与 battleLoop 的渲染/输入状态发生竞争而卡住。
    unit.guard = true;
    blog(`🛡️ <b>${unit.name}</b> 凝神戒备，进入防御姿态。`, 'good');
    renderBattleUnits();
    setTimeout(() => {
      if (battle.active && !battle.over) resolve();
      else resolve();
    }, 0);
  } else if (action === 'flee'){
    if (Math.random() < 0.6){
      battle.over = true;
      battle.fled = true;
      blog('💨 你施展身法，成功脱离了战斗！', 'warn');
    } else {
      blog('❌ 逃跑失败！', 'bad');
    }
    resolve();
  } else if (action === 'auto'){
    // 自动战斗：选最低血敌人普攻
    const enemies = battle.units.filter(u => u.alive && u.isEnemy);
    if (!enemies.length) { resolve(); return; }
    const target = enemies.reduce((a, b) => a.hp < b.hp ? a : b);
    performAttack(unit, target, 1.0, 'phys', resolve);
  }
}

function showTargetSelect(enemies, onSelect){
  const actions = $('battleActions');
  actions.innerHTML = '';
  
  const back = document.createElement('button');
  back.className = 'skill-back';
  back.textContent = '← 返回';
  back.addEventListener('click', () => {
    actions.innerHTML = '';
    // 重新进入玩家回合
    if (typeof playerTurn === 'function'){
      playerTurn(battle.units.find(u => u.isPlayer)).then(() => {});
    }
  });
  actions.appendChild(back);
  
  enemies.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'battle-skill basic';
    btn.innerHTML = `
      <span class="bs-name">${e.icon}${e.name}</span>
      <span class="bs-mp">HP ${Math.ceil(e.hp)}/${e.maxHp}</span>
    `;
    btn.addEventListener('click', () => {
      actions.innerHTML = '';
      onSelect(e);
    });
    actions.appendChild(btn);
  });
}

function showSkillMenu(unit, resolve){
  const actions = $('battleActions');
  actions.innerHTML = '';
  
  const skills = getSectSkills();
  
  if (!skills.length){
    blog('你尚未习得任何技能。', 'dim');
    // 重新进入玩家回合
    playerTurn(unit).then(resolve);
    return;
  }
  
  skills.forEach(sk => {
    const canUse = unit.mp >= sk.mp;
    const btn = document.createElement('button');
    btn.className = 'battle-skill' + (canUse ? '' : ' disabled');
    btn.innerHTML = `
      <span class="bs-type">${sk.type === 'magic' ? '法' : sk.type === 'phys' ? '武' : sk.type === 'heal' ? '疗' : '封'}</span>
      <span class="bs-name">${sk.name}</span>
      <span class="bs-mp">${sk.mp} 法力</span>
    `;
    if (canUse){
      btn.addEventListener('click', () => {
        actions.innerHTML = '';
        // 群体技能直接释放
        if (sk.target === 'all' || sk.type === 'heal'){
          unit.mp -= sk.mp;
          applySkill(unit, sk);
          resolve();
        } else {
          // 单体技能选目标
          const enemies = battle.units.filter(u => u.alive && u.isEnemy);
          if (enemies.length === 1){
            unit.mp -= sk.mp;
            applySkill(unit, sk, enemies[0]);
            resolve();
          } else {
            showTargetSelect(enemies, (t) => {
              unit.mp -= sk.mp;
              applySkill(unit, sk, t);
              resolve();
            });
          }
        }
      });
    }
    actions.appendChild(btn);
  });
  
  const back = document.createElement('button');
  back.className = 'skill-back';
  back.textContent = '← 返回';
  back.addEventListener('click', () => {
    actions.innerHTML = '';
    playerTurn(unit).then(resolve);
  });
  actions.appendChild(back);
}

function showItemMenu(unit, resolve){
  const actions = $('battleActions');
  actions.innerHTML = '';
  
  const bagItems = Object.keys(P.bag).filter(k => P.bag[k] > 0 && ITEMS[k] && ITEMS[k].type === 'potion');
  
  if (!bagItems.length){
    blog('你没有可用的药品。', 'dim');
    playerTurn(unit).then(resolve);
    return;
  }
  
  bagItems.forEach(id => {
    const it = ITEMS[id];
    const btn = document.createElement('button');
    btn.className = 'battle-skill item';
    btn.innerHTML = `
      <span class="bs-name">${it.icon}${it.name}</span>
      <span class="bs-mp">×${P.bag[id]}</span>
    `;
    btn.addEventListener('click', () => {
      actions.innerHTML = '';
      // 使用物品
      const result = it.use();
      P.bag[id]--;
      if (P.bag[id] <= 0) delete P.bag[id];
      blog(`🧪 <b>${unit.name}</b> 使用了 ${it.icon}${it.name}，${result}`, 'good');
      // 同步战斗单位数据
      unit.hp = P.hp;
      unit.mp = P.mp;
      renderBattleUnits();
      resolve();
    });
    actions.appendChild(btn);
  });
  
  const back = document.createElement('button');
  back.className = 'skill-back';
  back.textContent = '← 返回';
  back.addEventListener('click', () => {
    actions.innerHTML = '';
    playerTurn(unit).then(resolve);
  });
  actions.appendChild(back);
}

/* ==================== 执行攻击 ==================== */
function performAttack(caster, target, power, type, resolve){
  const { dmg, crit } = calcDamage(caster, target, power, type);
  target.hp = Math.max(0, target.hp - dmg);
  
  if (target.hp <= 0){
    target.alive = false;
  }
  
  // 动画
  shakeUnit(target.id);
  showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
  
  const isAlly = caster.isPlayer || caster.isPet;
  const cls = isAlly ? 'good' : 'bad';
  blog(
    `${crit ? '💥' : '⚔️'} <b>${caster.name}</b> 攻击 <b>${target.name}</b>，造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
    cls
  );
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'warn');
  }
  
  renderBattleUnits();
  setTimeout(resolve, 350);
}

/* ==================== 应用技能 ==================== */
function applySkill(caster, skill, target){
  // 治疗技能
  if (skill.type === 'heal'){
    const power = skill.power;
    const stat = caster.magic || caster.atk;
    const amount = Math.floor(stat * power * 1.5);
    const before = caster.hp;
    caster.hp = Math.min(caster.maxHp, caster.hp + amount);
    const actual = caster.hp - before;
    
    // 同步玩家血量
    if (caster.isPlayer){ P.hp = caster.hp; P.mp = caster.mp; }
    
    showDamageFloat(caster.id, `+${actual}`, 'heal');
    blog(`✨ <b>${caster.name}</b> 施展【${skill.name}】，恢复 <b>${actual}</b> 点气血！`, 'good');
    renderBattleUnits();
    return;
  }
  
  // 封印/定身
  if (skill.type === 'debuff'){
    if (!target) return;
    target.stun = (target.stun || 0) + 2;
    blog(`🔒 <b>${caster.name}</b> 施展【${skill.name}】，<b>${target.name}</b> 被定身 2 回合！`, 'warn');
    renderBattleUnits();
    return;
  }
  
  // 攻击技能
  let targets;
  if (skill.target === 'all'){
    targets = battle.units.filter(u => u.alive && (caster.isEnemy ? !u.isEnemy : u.isEnemy));
  } else {
    targets = [target];
  }
  
  targets.forEach(t => {
    if (!t || !t.alive) return;
    const { dmg, crit } = calcDamage(caster, t, skill.power, skill.type);
    t.hp = Math.max(0, t.hp - dmg);
    if (t.hp <= 0) t.alive = false;
    
    shakeUnit(t.id);
    showDamageFloat(t.id, `-${dmg}`, crit ? 'crit' : '');
    
    const isAlly = caster.isPlayer || caster.isPet;
    blog(
      `${crit ? '💥' : '✨'} <b>${caster.name}</b> 施展【${skill.name}】，对 <b>${t.name}</b> 造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
      isAlly ? 'good' : 'bad'
    );
    
    if (!t.alive){
      blog(`☠️ <b>${t.name}</b> 倒下了！`, 'warn');
    }
  });
  
  // 普度众生：攻击同时回血
  if (skill.id === 'pu'){
    const healAmt = Math.floor((caster.magic || caster.atk) * 0.8);
    caster.hp = Math.min(caster.maxHp, caster.hp + healAmt);
    if (caster.isPlayer){ P.hp = caster.hp; }
    showDamageFloat(caster.id, `+${healAmt}`, 'heal');
    blog(`💚 <b>${caster.name}</b> 同时恢复了 <b>${healAmt}</b> 点气血。`, 'good');
  }
  
  // 破釜沉舟：自损
  if (skill.id === 'po'){
    const selfDmg = Math.floor(caster.hp * 0.1);
    caster.hp = Math.max(1, caster.hp - selfDmg);
    if (caster.isPlayer){ P.hp = caster.hp; }
    showDamageFloat(caster.id, `-${selfDmg}`, '');
    blog(`💔 <b>${caster.name}</b> 燃烧气血，自损 <b>${selfDmg}</b> 点。`, 'dim');
  }
  
  renderBattleUnits();
}

/* ==================== 召唤兽回合 ==================== */
async function petTurn(unit){
  const enemies = battle.units.filter(u => u.alive && u.isEnemy);
  if (!enemies.length) return;
  const target = enemies.reduce((a, b) => a.hp < b.hp ? a : b);
  
  blog(`🐾 <b>${unit.name}</b> 扑向 <b>${target.name}</b>！`);
  await sleep(250);
  
  const { dmg, crit } = calcDamage(unit, target, 1.0, 'phys');
  target.hp = Math.max(0, target.hp - dmg);
  if (target.hp <= 0) target.alive = false;
  
  shakeUnit(target.id);
  showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
  
  blog(
    `${crit ? '💥' : '🐾'} 造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
    'good'
  );
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'warn');
  }
  
  renderBattleUnits();
  await sleep(300);
}

/* ==================== 怪物回合 ==================== */
async function monsterTurn(unit){
  const allies = battle.units.filter(u => u.alive && !u.isEnemy);
  if (!allies.length) return;
  
  // 优先攻击血量低的
  const target = allies.reduce((a, b) => a.hp < b.hp ? a : b);
  
  // 怪物偶尔使用技能
  if (unit.skills && unit.skills.length && Math.random() < 0.3){
    const sk = unit.skills[Math.floor(Math.random() * unit.skills.length)];
    const { dmg } = calcDamage(unit, target, sk.power || 1.3, sk.type || 'magic');
    target.hp = Math.max(0, target.hp - dmg);
    if (target.hp <= 0) target.alive = false;
    
    shakeUnit(target.id);
    showDamageFloat(target.id, `-${dmg}`, '');
    blog(`😈 <b>${unit.name}</b> 施展【${sk.name}】，对 <b>${target.name}</b> 造成 <b>${dmg}</b> 点伤害`, 'bad');
  } else {
    const { dmg, crit } = calcDamage(unit, target, 1.0, 'phys');
    target.hp = Math.max(0, target.hp - dmg);
    if (target.hp <= 0) target.alive = false;
    
    shakeUnit(target.id);
    showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
    blog(`👹 <b>${unit.name}</b> 攻击 <b>${target.name}</b>，造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`, 'bad');
  }
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'bad');
  }
  
  renderBattleUnits();
  await sleep(350);
}

/* ==================== 检查战斗结束 ==================== */
function checkBattleEnd(){
  const enemies = battle.units.filter(u => u.alive && u.isEnemy);
  const allies = battle.units.filter(u => u.alive && !u.isEnemy);
  
  if (enemies.length === 0){
    battle.over = true;
    battle.victory = true;
  } else if (allies.length === 0){
    battle.over = true;
    battle.victory = false;
  }
}

/* ==================== 战斗结算 ==================== */
function finishBattle(result){
  // 先解除战斗状态，确保结算界面出现后地图不会被旧状态锁死。
  battle.active = false;
  battle.over = true;
  
  const playerUnit = battle.units.find(u => u.isPlayer);
  const petUnit = battle.units.find(u => u.isPet);
  
  // 同步玩家状态
  if (playerUnit){
    P.hp = Math.max(1, playerUnit.hp);
    P.mp = playerUnit.mp;
  }
  if (petUnit && P.pet){
    P.pet.hp = Math.max(1, petUnit.hp);
  }
  
  const banner = $('resultBanner');
  banner.innerHTML = '';
  
  if (result === 'flee' || battle.fled){
    banner.innerHTML = `
      <div class="rb-title win" style="color:#80d0ff;text-shadow:3px 3px 0 #000,0 0 30px rgba(128,208,255,.9)">脱 离</div>
      <div class="rb-info">你成功脱离了战斗</div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
  } else if (result === 'draw'){
    banner.innerHTML = `
      <div class="rb-title" style="color:#c0a0e8">平 局</div>
      <div class="rb-info">战斗超时，双方各自收手</div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
  } else if (battle.victory){
    // 计算奖励
    let exp = 0, gold = 0;
    battle.units.filter(u => u.isEnemy).forEach(m => {
      exp += m.exp || 30;
      gold += m.gold || 15;
    });
    
    // 加成
    const bonus = 1 + P.lv * 0.05;
    exp = Math.floor(exp * bonus);
    gold = Math.floor(gold * bonus);
    
    P.gold += gold;
    P.battles++;
    gainExp(exp);
    
    banner.innerHTML = `
      <div class="rb-title win">胜 利</div>
      <div class="rb-info">
        获得经验 <b>+${fmt(exp)}</b><br>
        获得银两 <b>+${fmt(gold)}</b>
      </div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
    
    addLog(`【战斗】胜利！经验 +${exp}，银两 +${gold}`, 'good');
  } else {
    const lost = Math.floor(P.gold * 0.1);
    P.gold = Math.max(0, P.gold - lost);
    P.hp = Math.max(1, Math.floor(P.maxHp * 0.25));
    P.mp = Math.max(0, Math.floor(P.maxMp * 0.3));
    
    banner.innerHTML = `
      <div class="rb-title lose">战 败</div>
      <div class="rb-info">
        你被击倒在地……<br>
        损失银两 <b>${fmt(lost)}</b> 两
      </div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
    
    addLog(`【战斗】战败，损失 ${lost} 两`, 'bad');
  }
  
  banner.classList.add('show');
  
  // 绑定继续按钮
  setTimeout(() => {
    const okBtn = $('rbOk');
    if (okBtn){
      okBtn.addEventListener('click', () => {
        closeBattleUI();
      });
    }
  }, 50);
  
  updateHUD();
}

function closeBattleUI(){
  // 彻底清理战斗锁与当前回合状态。
  battle.token++;
  battle.loopRunning = false;
  battle.active = false;
  battle.over = true;
  battle.victory = false;
  battle.fled = false;
  const overlay = battle.overlay;
  if (overlay){
    overlay.classList.add('fading');
    setTimeout(() => {
      overlay.classList.remove('show');
      overlay.classList.remove('fading');
      $('resultBanner').classList.remove('show');
    }, 300);
  }
  battle.units = [];
  battle.round = 0;
  renderWorld();
}

let shopTab = 'buy';
let shopSelectedItem = null;

function openShopPanel(){

        </div>

function renderShopPanel(){

      <button class="btn small ${shopTab==='buy'?'primary':''}" data-stab="buy" style="flex:1">购 买</button>

      <span style="font-size:11px;color:#c0a870">💰 你的银两</span>

    </div>
    <div id="shopItems"></div>
  `;

    btn.addEventListener('click', () => {
      shopTab = btn.dataset.stab;
      renderShopPanel();

  if (shopTab === 'buy'){

  } else {
