function renderBuyList(list){
  // 商店出售的药品
  const buyables = ['hp1', 'hp2', 'hp3', 'mp1', 'mp2', 'exp1', 'exp2', 'stone1', 'stone2', 'stone3'];
  
  buyables.forEach(id => {
    const it = ITEMS[id];
    if (!it) return;
    const rare = it.rare || 0;
    const itEl = document.createElement('div');
    itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
    itEl.innerHTML = `
      <div class="li-icon" style="font-size:22px">${it.icon}</div>
      <div class="li-body">
        <div class="li-name">${it.name}</div>
        <div class="li-desc">${it.desc}</div>
      </div>
      <div class="li-right" style="color:#ffd060">${fmt(it.price)}<small>两</small></div>
    `;
    const btn = document.createElement('button');
    btn.className = 'li-btn';
    btn.textContent = '购买';
    btn.disabled = P.gold < it.price;
    btn.addEventListener('click', () => {
      if (P.gold < it.price) return;
      // 检查背包空间
      const keys = Object.keys(P.bag).filter(k => P.bag[k] > 0);
      if (keys.length >= 20 && !P.bag[id]){
        toast('背包已满');
        return;
      }
      P.gold -= it.price;
      P.bag[id] = (P.bag[id] || 0) + 1;
      toast(`🛒 购入 ${it.icon}${it.name}`);
      addLog(`【购买】${it.name} 花费 ${it.price} 两`, 'good');
      updateHUD();
      renderShopPanel();
    });
    itEl.appendChild(btn);
    list.appendChild(itEl);
  });
}

function renderSellList(list){
  const keys = Object.keys(P.bag).filter(k => P.bag[k] > 0);
  
  if (!keys.length){
    list.innerHTML = '<div class="empty-tip"><span class="ei">🎒</span>背包中没有可出售的物品</div>';
    return;
  }
  
  keys.forEach(id => {
    const it = ITEMS[id];
    if (!it) return;
    // 出售价为原价 50%
    const sellPrice = Math.floor((it.price || 0) * 0.5);
    const rare = it.rare || 0;
    
    const itEl = document.createElement('div');
    itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
    itEl.innerHTML = `
      <div class="li-icon" style="font-size:22px">${it.icon}</div>
      <div class="li-body">
        <div class="li-name">${it.name}<span class="li-count">×${P.bag[id]}</span></div>
        <div class="li-desc">${it.desc}</div>
      </div>
      <div class="li-right" style="color:#80ffa0">+${fmt(sellPrice)}<small>两</small></div>
    `;
    const btn = document.createElement('button');
    btn.className = 'li-btn';
    btn.textContent = '出售';
    btn.disabled = sellPrice <= 0;
    btn.addEventListener('click', () => {
      if (sellPrice <= 0) return;
      P.gold += sellPrice;
      P.bag[id]--;
      if (P.bag[id] <= 0) delete P.bag[id];
      toast(`💰 出售 ${it.icon}${it.name}，获得 ${sellPrice} 两`);
      addLog(`【出售】${it.name} 获得 ${sellPrice} 两`, 'good');
      updateHUD();
      renderShopPanel();
    });
    itEl.appendChild(btn);
    list.appendChild(itEl);
  });
}

/* ============================================================
   第 8 批：初始化 / 游戏主循环 / 存档系统
   ============================================================ */

const SAVE_KEY = 'mhxy_single_player_save_v1';
let gameLoopTimer = null;

/* 保存游戏 */
function saveGame(){
  try{
    const data = {
      name:P.name, sect:P.sect, lv:P.lv, exp:P.exp,
      hp:P.hp, maxHp:P.maxHp, mp:P.mp, maxMp:P.maxMp,
      atk:P.atk, def:P.def, spd:P.spd, magic:P.magic,
      gold:P.gold, x:P.x, y:P.y, scene:P.scene, subScene:P.subScene,
      bag:P.bag, pet:P.pet, petBox:P.petBox, steps:P.steps,
      logs:Array.isArray(P.logs) ? P.logs.slice(-50) : []
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(err){
    console.warn('保存游戏失败：', err);
    return false;
  }
}

/* 读取存档 */
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return false;

    const allowed = [
      'name','sect','lv','exp','hp','maxHp','mp','maxMp',
      'atk','def','spd','magic','gold','x','y','scene','subScene',
      'bag','pet','petBox','steps','logs'
    ];
    allowed.forEach(key => {
      if (Object.prototype.hasOwnProperty.call(data, key)) P[key] = data[key];
    });

    /* 防止旧存档或手工修改造成非法数值 */
    P.lv = Math.max(1, Number(P.lv) || 1);
    P.exp = Math.max(0, Number(P.exp) || 0);
    P.maxHp = Math.max(1, Number(P.maxHp) || 100);
    P.maxMp = Math.max(1, Number(P.maxMp) || 50);
    P.hp = clamp(Number(P.hp) || P.maxHp, 0, P.maxHp);
    P.mp = clamp(Number(P.mp) || P.maxMp, 0, P.maxMp);
    P.gold = Math.max(0, Number(P.gold) || 0);
    P.x = Number.isFinite(Number(P.x)) ? Number(P.x) : 0;
    P.y = Number.isFinite(Number(P.y)) ? Number(P.y) : 0;
    P.steps = Math.max(0, Number(P.steps) || 0);
    if (!P.bag || typeof P.bag !== 'object') P.bag = {};
    if (!Array.isArray(P.petBox)) P.petBox = [];
    if (!Array.isArray(P.logs)) P.logs = [];

    return Boolean(P.sect);
  }catch(err){
    console.warn('读取存档失败：', err);
    return false;
  }
}

/* 清除存档 */
function clearSave(){
  try{
    localStorage.removeItem(SAVE_KEY);
    return true;
  }catch(err){
    console.warn('清除存档失败：', err);
    return false;
  }
}

/* 游戏主循环：负责定时刷新 HUD，并自动保存 */
function startGameLoop(){
  if (gameLoopTimer) clearInterval(gameLoopTimer);

  updateHUD();
  renderWorld();

  gameLoopTimer = setInterval(() => {
    if (battle && battle.active) return;

    /* 非战斗状态下缓慢恢复，避免数值溢出 */
    if (P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + 1);
    if (P.mp < P.maxMp) P.mp = Math.min(P.maxMp, P.mp + 1);

    updateHUD();
    saveGame();
  }, 5000);

  saveGame();
}

/* 窗口大小变化后重新绘制视野 */
window.addEventListener('resize', () => {
  if (P.sect) renderWorld();
});

/* 页面隐藏/关闭时保存 */
window.addEventListener('pagehide', saveGame);
window.addEventListener('beforeunload', saveGame);

/* 游戏初始化 */
function initGame(){
  const hasSave = loadGame();

  updateHUD();

  if (hasSave && P.sect && SECTS.some(s => s.id === P.sect)){
    $('modalSect').classList.remove('show');
    renderWorld();
    startGameLoop();
    toast('💾 已读取上次游戏进度');
    return;
  }

  /* 没有有效存档时进入门派选择 */
  P.sect = null;
  renderSectSelect();
  $('modalSect').classList.add('show');
}

/* DOM 已经在脚本前生成，因此这里可以直接初始化 */
initGame();



/* 响应式重绘：设备旋转、浏览器地址栏收起/展开、窗口尺寸变化时重新计算地图 */
(function responsiveLayout(){
  let raf = 0;
  function refreshLayout(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      document.documentElement.style.setProperty('--vw', `${window.innerWidth}px`);
      document.documentElement.style.setProperty('--vh', `${window.innerHeight}px`);
      if (typeof P !== 'undefined' && P.sect && typeof renderWorld === 'function') {
        renderWorld();
      }
    });
  }
  window.addEventListener('resize', refreshLayout, {passive:true});
  window.addEventListener('orientationchange', () => setTimeout(refreshLayout, 120), {passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', refreshLayout, {passive:true});
  }
  refreshLayout();
})();


/* ================= 最终屏幕尺寸同步 ================= */
(function(){
  let resizeTimer = 0;
  function syncViewport(){
    document.documentElement.style.setProperty('--vw', window.innerWidth + 'px');
    document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
    const g = document.getElementById('game');
    if (g){
      g.style.width = '100vw';
      g.style.maxWidth = '100vw';
      g.style.height = '100dvh';
    }
    if (typeof renderWorld === 'function') renderWorld();
  }
  function schedule(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(syncViewport, 80);
  }
  window.addEventListener('resize', schedule, {passive:true});
  window.addEventListener('orientationchange', schedule, {passive:true});
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', schedule, {passive:true});
  }
  syncViewport();
})();

/* 禁止移动端双击缩放/页面手势拖动（不影响弹窗内部滚动） */
document.addEventListener('dblclick', function(e){
  e.preventDefault();
}, {passive:false});
document.addEventListener('gesturestart', function(e){
  e.preventDefault();
}, {passive:false});
document.addEventListener('gesturechange', function(e){
  e.preventDefault();
}, {passive:false});
document.addEventListener('gestureend', function(e){
  e.preventDefault();
}, {passive:false});
</script>
